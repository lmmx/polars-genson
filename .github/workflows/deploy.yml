name: Deploy Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "The Python package's version bump (the crates' come from their commits)"
        type: choice
        options: [patch, minor, major]
        default: patch

jobs:
  deploy-release:
    name: Run just release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install just
        uses: taiki-e/install-action@64adfd9e935fa438859b9e080fd026720b2ba070 # tag=just
        with:
          tool: just@1.38.0,echo-comment@0.2.0,release-plz@0.3.172

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Bump the versions (the Python package's, and each changed crate's with its
      # changelog), commit the changes, tag the Python version, and push both: CI then
      # publishes the wheels to PyPI and the crates to crates.io
      - name: Run just release
        run: just release ${{ inputs.bump }}
