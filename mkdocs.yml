site_name: Polars Genson
site_author: Louis Maddox
site_description: >-
  Infer a schema from JSON string columns and normalise them into typed Polars columns
site_url: https://polars-genson.vercel.app
repo_name: lmmx/polars-genson
repo_url: https://github.com/lmmx/polars-genson
strict: true

# Development notes, not user documentation
exclude_docs: |
  JOURNAL.md
  journal/
  vercel/

# Rebuild when your Python sources change
watch:
  - polars-genson-py/python

theme:
  name: material
  custom_dir: docs/theme
  palette:
    - scheme: default
      primary: white
  icon:
    repo: fontawesome/brands/github
  features:
    - content.code.copy
    - navigation.instant
    - navigation.instant.progress
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - search
    - search.suggest
  font:
    text: Inter
    code: Source Code Pro

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/lmmx
  generator: false

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      noclasses: true
      pygments_style: lovelace
  - pymdownx.inlinehilite
  - pymdownx.magiclink:
      repo_url_shortener: true
      normalize_issue_symbols: true
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - sane_lists
  - mdx_truly_sane_lists:
      nested_indent: 2
      truly_sane: true
  - toc:
      permalink: true

extra_javascript:
  - docs/theme/js/katex.js
  - https://unpkg.com/katex@0/dist/katex.min.js
  - https://unpkg.com/katex@0/dist/contrib/auto-render.min.js

extra_css:
  - docs/theme/stylesheets/extra.css
  - https://unpkg.com/katex@0/dist/katex.min.css

plugins:
  - autorefs
  - markdown-exec
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          # Point mkdocstrings at your import roots so it can import the package
          paths:
            - polars-genson-py/python
          options:
            docstring_style: numpy
            members_order: source
            separate_signature: true
            filters: ["!^_"]
            docstring_options:
              ignore_init_summary: true
            merge_init_into_class: true
            line_length: 88
            show_root_full_path: false
            show_root_toc_entry: false
            show_source: true
            show_submodules: true
            show_signature_annotations: true
  - search
  - section-index
  - llmstxt:
      markdown_description: >-
        polars-genson infers a schema from a column of JSON strings in a Polars DataFrame or
        Parquet file, then normalises every row to it, so JSON whose rows differ in shape
        becomes consistent typed Polars columns.
      full_output: llms-full.txt
      sections:
        Getting started:
          - get_started.md: Installation and a quickstart
        Guides:
          - guides/infer-schema.md: Infer a Polars schema, JSON Schema or Avro schema from a JSON column
          - guides/normalise.md: Normalise a JSON column into typed columns, a struct column or JSON strings
          - guides/parquet.md: Normalise a JSON string column in a Parquet file straight to typed Parquet output
          - guides/extract-invariants.md: Move data repeated per key (embedded copies of referenced records) into a lookup table
          - guides/large-inputs.md: Speed and memory for large inputs
        How it works:
          - concepts/type-mapping.md: Which Polars dtype each kind of JSON value becomes
          - concepts/nulls-and-empty-values.md: Missing keys, null values, empty arrays and objects, null rows
          - concepts/maps-and-records.md: When an object becomes a struct or a list of key/value structs
          - concepts/mixed-types.md: What happens when one field holds different kinds of value
          - concepts/key-order.md: How fields are ordered, and combining output from several inputs
        Reference:
          - api/polars_genson.md: Every public function and DataFrame method
          - reference/options.md: Every option with its default and the functions that accept it
          - changelog.md: Release notes
  # - extra-sass   # enable if you actually add scss

nav:
  - Home: index.md
  - Getting started: get_started.md
  - Guides:
      - guides/index.md
      - Infer a schema: guides/infer-schema.md
      - Normalise a column: guides/normalise.md
      - JSON in Parquet: guides/parquet.md
      - Factor out repeated data: guides/extract-invariants.md
      - Large inputs: guides/large-inputs.md
  - How it works:
      - concepts/index.md
      - Type mapping: concepts/type-mapping.md
      - Nulls and empty values: concepts/nulls-and-empty-values.md
      - Maps and records: concepts/maps-and-records.md
      - Mixed types: concepts/mixed-types.md
      - Field order: concepts/key-order.md
  - Reference:
      - api/index.md
      - API: api/polars_genson.md
      - Options: reference/options.md
  - Changelog: changelog.md
