[dependencies]
anstream = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
xxhash-rust = { workspace = true }

# Optional dependencies
arrow = { optional = true, version = "60.0.0" }
# Not avrotize's default `http` feature (fetching schemas over http(s): reqwest, tokio,
# hyper and OpenSSL), once avrotize has one: genson converts the schemas it infers
avrotize = { default-features = false, optional = true, version = "0.2.0" }
crustrace = { features = ["debug"], optional = true, version = "0.1.9" }
crustrace-mermaid = { optional = true, version = "0.1.6" }
parquet = { optional = true, version = "60.0.0" }
# The Parquet writer (pq_glue::write)
pq-glue = { features = ["write"], optional = true, version = "0.3.0" }
tracing = { optional = true, version = "0.1.41" }
tracing-subscriber = { optional = true, version = "0.3.20" }

# Vendored from genson-rs
memchr.workspace = true
mimalloc.workspace = true
ordermap.workspace = true
rayon.workspace = true
regex.workspace = true
rustc-hash.workspace = true
simd-json.workspace = true

[features]
# Counting allocations by stage (`genson_core::phase`), for the performance scorecard
alloc-stats = []
avro = ["avrotize"]
default = []
parquet = ["dep:arrow", "dep:parquet", "dep:pq-glue"]
trace = ["crustrace", "crustrace-mermaid", "tracing", "tracing-subscriber"]

[package]
authors.workspace = true
categories = ["data-structures", "encoding", "parsing"]
description = "Core library for JSON schema inference using genson-rs"
edition.workspace = true
homepage.workspace = true
keywords = ["core", "genson", "inference", "json", "schema"]
license.workspace = true
name = "genson-core"
readme = "README.md"
repository.workspace = true
version = "1.3.1"

[dev-dependencies]
criterion = { features = ["html_reports"], version = "0.8" }
predicates = "3.1.3"
tempfile = "3"

[package.metadata.cargo-machete]
ignored = ["crustrace", "tracing"]

[[bench]]
harness = false
name = "schema_inference"
